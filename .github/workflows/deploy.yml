name: Deploy to GitHub Pages

on:
  push:
    branches: [main, shit]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Switch to static export
        run: "sed -i \"s/output: 'standalone'/output: 'export'/\" next.config.ts"
      - run: npm run build
        env:
          NODE_ENV: production
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    # The github-pages environment only permits `main`; gate the deploy job so
    # feature-branch pushes (e.g. `shit`) still build as CI without a rejected
    # deployment. Only main publishes to Pages.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
